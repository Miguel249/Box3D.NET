name: Release

# Publishing is driven by a version tag. Pushing v1.2.3 builds the native
# library for every supported platform, packs it together with the managed
# assemblies, and publishes to NuGet.
#
# Authentication uses NuGet trusted publishing rather than a stored API key.
# The setup, done once on nuget.org under Trusted Publishing:
#
#   Policy Name      anything memorable
#   Package Owner    the NuGet account that will own the packages
#   CI/CD Provider   GitHub Actions
#   Repository Owner the GitHub user or organisation
#   Repository       the repository name, matching its canonical casing
#   Workflow File    release.yml
#   Environment      leave empty, unless a job below declares one
#
# A policy created before the package exists is valid for seven days, which is
# the window in which the first publish has to happen. Once a package exists
# under that owner, the policy stops expiring.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v (for example 1.2.3)'
        required: true
        type: string

# id-token is what makes NuGet trusted publishing work: GitHub mints a
# short-lived OIDC token describing this exact repository and workflow, and
# NuGet exchanges it for an API key valid for a few minutes. Nothing long-lived
# is stored anywhere, so there is no key to leak, rotate or expire.
permissions:
  contents: write
  id-token: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  native:
    name: native (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    # A hung release job is worse than a failed one: it holds the tag in limbo
    # until GitHub's six-hour default kills it. See the note in ci.yml.
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest,   rid: win-x64 }
          - { os: windows-11-arm,   rid: win-arm64 }
          - { os: ubuntu-latest,    rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: macos-14,         rid: osx-x64 }
          - { os: macos-14,         rid: osx-arm64 }
          - { os: ubuntu-latest,    rid: android-arm64 }
          - { os: ubuntu-latest,    rid: android-x64 }

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        if: startsWith(matrix.rid, 'android-')
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build Box3D
        shell: pwsh
        run: ./tools/build-native.ps1 -Rid ${{ matrix.rid }} -Configuration Release

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: runtimes/${{ matrix.rid }}/native/
          if-no-files-found: error

  # One job for all three iOS slices, because they have to be merged into a
  # single xcframework and only Apple's tooling can do the merging. See the
  # equivalent job in ci.yml.
  apple:
    name: native (ios)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build every iOS slice
        shell: pwsh
        run: |
          foreach ($rid in 'ios-arm64', 'iossimulator-arm64', 'iossimulator-x64') {
              ./tools/build-native.ps1 -Rid $rid -Configuration Release
          }

      - name: Assemble the xcframework
        shell: pwsh
        run: ./tools/create-xcframework.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: apple-xcframework
          path: artifacts/apple/box3d.xcframework/
          if-no-files-found: error

  publish:
    name: publish
    needs: [native, apple]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # .NET 10 is required to build the iOS assembly; every other platform is
      # still net8.0. See the same step in ci.yml.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install the iOS workload
        run: dotnet workload install ios --skip-sign-check

      - name: Resolve the version
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
              '${{ inputs.version }}'
          } else {
              '${{ github.ref_name }}' -replace '^v', ''
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
              throw "Not a semantic version: $version"
          }
          Write-Host "publishing $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Collect every native runtime
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: ./artifacts/native

      - name: Collect the iOS framework
        uses: actions/download-artifact@v4
        with:
          name: apple-xcframework
          path: ./artifacts/apple/box3d.xcframework

      - name: Stage the runtimes
        shell: pwsh
        run: |
          foreach ($dir in Get-ChildItem ./artifacts/native -Directory) {
              $rid = $dir.Name -replace '^native-', ''
              $target = "runtimes/$rid/native"
              New-Item -ItemType Directory -Force $target | Out-Null
              Copy-Item "$($dir.FullName)/*" $target -Recurse -Force
          }

      # Every platform must be present. Shipping a package that silently lacks
      # one is worse than not shipping, because it fails at the user's run time.
      - name: Verify every runtime is present
        shell: pwsh
        run: |
          $required = @(
              'win-x64', 'win-arm64'
              'linux-x64', 'linux-arm64'
              'osx-x64', 'osx-arm64'
              'android-arm64', 'android-x64'
          )
          $missing = $required | Where-Object { -not (Get-ChildItem "runtimes/$_/native" -File -ErrorAction SilentlyContinue) }
          if ($missing) {
              throw "No native library staged for: $($missing -join ', ')"
          }
          Write-Host "All $($required.Count) runtimes present."

          # iOS ships as build files rather than runtime assets, so it needs its
          # own check. A framework with only the device variant links for
          # everyone and then fails for everyone on the simulator.
          $framework = './artifacts/apple/box3d.xcframework'
          if (-not (Test-Path "$framework/Info.plist")) {
              throw "No iOS xcframework was staged at $framework."
          }

          $variants = Get-ChildItem $framework -Directory | ForEach-Object { $_.Name }
          Write-Host "xcframework variants: $($variants -join ', ')"

          if (-not ($variants | Where-Object { $_ -notlike '*simulator*' })) {
              throw 'The xcframework has no device variant.'
          }
          if (-not ($variants | Where-Object { $_ -like '*simulator*' })) {
              throw 'The xcframework has no simulator variant.'
          }

      - name: Pack
        run: >
          dotnet pack
          --configuration Release
          --output ./artifacts/packages
          -p:Version=${{ steps.version.outputs.version }}

      # Inspect the exact files about to be pushed. A version on nuget.org
      # cannot be withdrawn, only delisted, so this is the last moment at which
      # a missing native asset or a doubled runtimes path costs nothing.
      - name: Inspect the packages
        shell: pwsh
        run: |
          $required = @(
              'runtimes/win-x64/native/box3d.dll'
              'runtimes/win-arm64/native/box3d.dll'
              'runtimes/linux-x64/native/libbox3d.so'
              'runtimes/linux-arm64/native/libbox3d.so'
              'runtimes/osx-x64/native/libbox3d.dylib'
              'runtimes/osx-arm64/native/libbox3d.dylib'
              'runtimes/android-arm64/native/libbox3d.so'
              'runtimes/android-x64/native/libbox3d.so'
          )

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $failed = $false

          foreach ($package in Get-ChildItem ./artifacts/packages -Filter *.nupkg) {
              Write-Host "== $($package.Name) ($([math]::Round($package.Length / 1KB, 1)) KB)"
              $zip = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
              try {
                  $entries = $zip.Entries.FullName
                  $entries | Sort-Object | ForEach-Object { Write-Host "   $_" }

                  foreach ($entry in $entries) {
                      if ($entry -match '\.(pdb|user|suo)$' -or $entry -match '(^|/)(obj|bin)/') {
                          Write-Host "::error::$($package.Name) contains a build leftover: $entry"
                          $failed = $true
                      }
                      if ($entry -match 'runtimes/.*/runtimes/') {
                          Write-Host "::error::$($package.Name) has a doubled runtimes path: $entry"
                          $failed = $true
                      }
                  }

                  if ($package.Name -like 'Box3D.NET.Native.*') {
                      foreach ($asset in $required) {
                          if ($entries -notcontains $asset) {
                              Write-Host "::error::$($package.Name) is missing $asset"
                              $failed = $true
                          }
                      }

                      # iOS travels as build files, not runtime assets, so the
                      # loop above cannot see it. A package that restores on iOS
                      # and then cannot link is precisely what this step is the
                      # last chance to catch.
                      if (-not ($entries | Where-Object { $_ -like 'buildTransitive/*/Box3D.NET.Native.targets' })) {
                          Write-Host "::error::$($package.Name) carries no iOS build file"
                          $failed = $true
                      }

                      foreach ($variant in 'ios-arm64', 'simulator') {
                          if (-not ($entries | Where-Object { $_ -like "buildTransitive/*/box3d.xcframework/*$variant*/libbox3d.a" })) {
                              Write-Host "::error::$($package.Name) is missing the $variant archive of box3d.xcframework"
                              $failed = $true
                          }
                      }

                      # A static archive under runtimes/ serves no platform:
                      # nothing loads one at run time. It would only add weight.
                      foreach ($entry in $entries) {
                          if ($entry -like 'runtimes/*/*.a') {
                              Write-Host "::error::$($package.Name) has a static archive under runtimes/: $entry"
                              $failed = $true
                          }
                      }
                  }

                  foreach ($expected in 'README.md', 'LICENSE', 'THIRD-PARTY-NOTICES.txt', 'icon.png') {
                      if ($entries -notcontains $expected) {
                          Write-Host "::error::$($package.Name) is missing $expected"
                          $failed = $true
                      }
                  }
              }
              finally {
                  $zip.Dispose()
              }
          }

          foreach ($id in 'Box3D.NET', 'Box3D.NET.Native') {
              if (-not (Get-ChildItem ./artifacts/packages -Filter "$id.*.snupkg")) {
                  Write-Host "::error::no symbol package was produced for $id"
                  $failed = $true
              }
          }

          if ($failed) { throw 'Package inspection found problems. Nothing has been published.' }
          Write-Host 'Package contents verified.'

      # And install what is about to be published into a project that has never
      # heard of this repository, before publishing it.
      - name: Verify a fresh consumer can use the package
        shell: pwsh
        run: ./tools/verify-package.ps1 -Rid linux-x64 -Mode Framework -Version ${{ steps.version.outputs.version }}

      # Exchanges the workflow's OIDC token for a short-lived NuGet API key. The
      # trusted publishing policy on nuget.org names this repository and this
      # workflow file, so a token minted by any other workflow is refused.
      #
      # The user below is the NuGet account that owns the packages, which is the
      # "Package Owner" chosen when the policy was created. It is not a secret.
      - name: Authenticate to NuGet
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: Miguelcc.02

      - name: Publish to NuGet
        run: >
          dotnet nuget push "./artifacts/packages/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --skip-duplicate

      - name: Attach the packages to the release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/packages/*
          generate_release_notes: true
