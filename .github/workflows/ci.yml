name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Builds Box3D itself, once per target platform. The sources come from the
  # submodule and are never modified; only the resulting shared library is
  # published as an artifact for the jobs below.
  native:
    name: native (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    # Every job here carries a timeout. Without one a job that hangs rather than
    # fails runs until GitHub's six-hour default, burning the whole budget and
    # reporting nothing useful. These are roughly ten times the observed
    # duration, so they only ever fire on a genuine hang; timeout-minutes counts
    # execution, not the time a job spends queued.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   rid: win-x64 }
          - { os: windows-11-arm,   rid: win-arm64 }
          - { os: ubuntu-latest,    rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: macos-14,         rid: osx-x64 }
          - { os: macos-14,         rid: osx-arm64 }
          # Android cross-compiles from the Linux image, which already carries
          # an NDK; build-native.ps1 finds it through ANDROID_NDK_LATEST_HOME.
          # Only the 64-bit ABIs are built: Google Play has required 64-bit for
          # years, and armeabi-v7a would ship a slower scalar build, because
          # upstream disables NEON on armv7 where it has no divide or sqrt.
          - { os: ubuntu-latest,    rid: android-arm64 }
          - { os: ubuntu-latest,    rid: android-x64 }

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The NDK toolchain only drives single-configuration generators, so the
      # build needs Ninja. The Linux image has CMake but not Ninja.
      - name: Install Ninja
        if: startsWith(matrix.rid, 'android-')
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build Box3D
        shell: pwsh
        run: ./tools/build-native.ps1 -Rid ${{ matrix.rid }} -Configuration Release

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: runtimes/${{ matrix.rid }}/native/
          if-no-files-found: error
          retention-days: 7

  # iOS is built in one job rather than as three more rows above, because its
  # three slices are not three independent outputs: they have to be merged into
  # a single xcframework, and only a job holding all of them can do that. The
  # merge is Apple tooling, so it cannot be deferred to the pack job on Linux
  # either.
  apple:
    name: native (ios)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build every iOS slice
        shell: pwsh
        run: |
          foreach ($rid in 'ios-arm64', 'iossimulator-arm64', 'iossimulator-x64') {
              ./tools/build-native.ps1 -Rid $rid -Configuration Release
          }

      - name: Assemble the xcframework
        shell: pwsh
        run: ./tools/create-xcframework.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: apple-xcframework
          path: artifacts/apple/box3d.xcframework/
          if-no-files-found: error
          retention-days: 7

  # Runs the managed test suite against the real native library. The layout and
  # math tests would pass without one; the interop tests are the ones that
  # actually prove the binding, so this job fails if any test is skipped.
  test:
    name: test (${{ matrix.rid }})
    needs: native
    runs-on: ${{ matrix.os }}
    # The suite runs in well under two minutes. It is also the job most likely
    # to hang rather than fail: a threading test that deadlocks or spins inside
    # the native library takes the runner with it.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest,  rid: linux-x64 }
          - { os: macos-14,       rid: osx-arm64 }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: runtimes/${{ matrix.rid }}/native/

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: >
          dotnet test
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./artifacts/test-results

      # A skipped interop test means the native library failed to load, which
      # would otherwise look like a green build.
      - name: Fail if any test was skipped
        shell: pwsh
        run: |
          $trx = Get-ChildItem ./artifacts/test-results -Filter *.trx -Recurse | Select-Object -First 1
          [xml] $results = Get-Content $trx.FullName
          $counters = $results.TestRun.ResultSummary.Counters
          Write-Host "total=$($counters.total) passed=$($counters.passed) failed=$($counters.failed) skipped=$($counters.notExecuted)"
          if ([int]$counters.notExecuted -gt 0) {
              throw "$($counters.notExecuted) test(s) were skipped. On CI the native library is always staged, so a skip means it failed to load."
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.rid }}
          path: ./artifacts/test-results/
          retention-days: 7

  # Verifies formatting and that the generated bindings match the submodule.
  # A hand-edited Generated/*.g.cs would be silently overwritten on the next
  # regeneration, so the check exists to catch that before it happens.
  lint:
    name: format and generated sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The quality gates were once disabled by a condition that silently
      # evaluated to false, which cost nothing at build time and quietly stopped
      # the XML documentation and the AOT analyzers from running at all. A green
      # build is not evidence that they are on, so they are asserted directly.
      #
      # DocumentationFile is checked alongside the flags, and not because it is
      # a gate itself. GenerateDocumentationFile is only a request: the SDK turns
      # it into a path early, before Directory.Build.targets is imported, so the
      # flag once read 'true' here while the path stayed empty. An empty path
      # means no CS1591, which means the documentation gate passes without
      # checking anything. The flag alone cannot tell the two apart.
      - name: Verify the quality gates are actually enabled
        shell: pwsh
        run: |
          $failed = $false
          foreach ($project in @('src/Box3D.NET/Box3D.NET.csproj', 'src/Box3D.NET.Native/Box3D.NET.Native.csproj')) {
              $json = dotnet msbuild $project `
                  -getProperty:GenerateDocumentationFile `
                  -getProperty:DocumentationFile `
                  -getProperty:IsAotCompatible `
                  -getProperty:IsTrimmable `
                  -getProperty:TreatWarningsAsErrors | ConvertFrom-Json

              foreach ($gate in 'GenerateDocumentationFile', 'IsAotCompatible', 'IsTrimmable', 'TreatWarningsAsErrors') {
                  $value = $json.Properties.$gate
                  if ($value -ne 'true') {
                      Write-Host "::error::$project has $gate = '$value', expected 'true'"
                      $failed = $true
                  }
              }

              $docFile = $json.Properties.DocumentationFile
              if ([string]::IsNullOrWhiteSpace($docFile)) {
                  Write-Host "::error::$project has GenerateDocumentationFile = true but DocumentationFile is empty, so no documentation is emitted and CS1591 never fires."
                  $failed = $true
              }
              else {
                  Write-Host "$project : documentation -> $docFile"
              }

              Write-Host "$project : gates verified"
          }
          if ($failed) { throw 'One or more quality gates are disabled.' }

      # The committed ABI is what AbiTests holds every managed struct to. If a
      # submodule bump moves a field, the recorded file and the headers diverge
      # here, before the mismatch can reach a released package and start reading
      # the wrong bytes at a consumer's run time.
      - name: Verify the recorded native ABI is up to date
        shell: pwsh
        run: ./tools/dump-abi.ps1 -Check

      # Every Box3D function is accounted for: bound by the generator, bound by
      # hand, or listed with a reason for not being bound at all. A function
      # that disappears from the binding without anyone noticing is the failure
      # this prevents.
      - name: Verify the API coverage matrix is up to date
        shell: pwsh
        run: ./tools/api-coverage.ps1 -Check

      - name: Verify formatting
        run: dotnet format --verify-no-changes --severity warn

      - name: Regenerate the bindings
        shell: pwsh
        run: ./tools/generate-bindings.ps1

      - name: Verify the generated bindings are up to date
        shell: pwsh
        run: |
          $diff = git status --porcelain src/Box3D.NET.Native/Generated
          if ($diff) {
              Write-Host $diff
              git diff -- src/Box3D.NET.Native/Generated
              throw "The generated bindings differ from what tools/generate-bindings.ps1 produces. Re-run it and commit the result."
          }
          Write-Host "Generated bindings are up to date."

  # Confirms the whole stack survives NativeAOT, which the samples project is
  # configured for. This is the check that would catch a reflection dependency
  # or a marshalling pattern the AOT compiler cannot handle.
  aot:
    name: NativeAOT
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install the native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: runtimes/linux-x64/native/

      - name: Publish the samples with NativeAOT
        run: >
          dotnet publish src/Box3D.NET.Samples/Box3D.NET.Samples.csproj
          --configuration Release
          --runtime linux-x64
          -p:PublishAot=true

      - name: Run the published samples
        run: |
          cp runtimes/linux-x64/native/libbox3d.so \
             src/Box3D.NET.Samples/bin/Release/net8.0/linux-x64/publish/
          ./src/Box3D.NET.Samples/bin/Release/net8.0/linux-x64/publish/Box3D.NET.Samples

  # Produces the packages that a release would publish, with every platform's
  # native library inside, and keeps them as an artifact for inspection.
  # On macOS, and not by preference: this is the only job that builds the
  # packages' iOS assembly, and the iOS workload has no Linux host pack at all.
  # "dotnet workload install ios" fails on ubuntu rather than installing
  # something that cannot link, so the packaging job goes where the toolchain
  # exists. Everything else it does is platform-independent.
  pack:
    name: pack
    needs: [native, apple, test, lint]
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # .NET 10 is here for the iOS target framework alone. The packages
      # themselves still target net8.0 for every other platform, but the iOS
      # assembly cannot be built by the .NET 8 SDK: its mobile workloads are out
      # of support and the SDK refuses net8.0-ios outright.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Only the iOS workload, and only to compile the managed assembly. Linking
      # an actual application needs Xcode and happens in the consumer job; this
      # produces the library half.
      - name: Install the iOS workload
        run: dotnet workload install ios --skip-sign-check

      - name: Collect every native runtime
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: ./artifacts/native

      - name: Collect the iOS framework
        uses: actions/download-artifact@v4
        with:
          name: apple-xcframework
          path: ./artifacts/apple/box3d.xcframework

      # download-artifact places each artifact in its own folder named after
      # the artifact, so native-win-x64/box3d.dll becomes
      # runtimes/win-x64/native/box3d.dll.
      - name: Stage the runtimes
        shell: pwsh
        run: |
          foreach ($dir in Get-ChildItem ./artifacts/native -Directory) {
              $rid = $dir.Name -replace '^native-', ''
              $target = "runtimes/$rid/native"
              New-Item -ItemType Directory -Force $target | Out-Null
              Copy-Item "$($dir.FullName)/*" $target -Recurse -Force
              Write-Host "staged $rid"
          }
          Get-ChildItem runtimes -Recurse -File | ForEach-Object { $_.FullName.Replace((Get-Location).Path, '') }

      # The native matrix above runs with fail-fast disabled, so that one broken
      # platform still reports the others. The cost of that is that this job is
      # reached with whatever succeeded, and dotnet pack will happily produce a
      # package missing a platform and call it a success. The release workflow
      # has always checked this before publishing; CI did not, so a platform
      # could break and the packages artifact still look right.
      - name: Verify every runtime is present
        shell: pwsh
        run: |
          $required = @(
              'win-x64', 'win-arm64'
              'linux-x64', 'linux-arm64'
              'osx-x64', 'osx-arm64'
              'android-arm64', 'android-x64'
          )
          $missing = $required | Where-Object { -not (Get-ChildItem "runtimes/$_/native" -File -ErrorAction SilentlyContinue) }
          if ($missing) {
              throw "No native library staged for: $($missing -join ', ')"
          }
          Write-Host "All $($required.Count) runtimes present."

          # iOS is checked separately because it is not a runtime asset. The
          # framework has to hold both variants: a device-only one links fine
          # and then fails for everyone running on the simulator, which is most
          # people most of the time.
          $framework = './artifacts/apple/box3d.xcframework'
          if (-not (Test-Path "$framework/Info.plist")) {
              throw "No iOS xcframework was staged at $framework."
          }

          $variants = Get-ChildItem $framework -Directory | ForEach-Object { $_.Name }
          Write-Host "xcframework variants: $($variants -join ', ')"

          if (-not ($variants | Where-Object { $_ -notlike '*simulator*' })) {
              throw 'The xcframework has no device variant.'
          }
          if (-not ($variants | Where-Object { $_ -like '*simulator*' })) {
              throw 'The xcframework has no simulator variant.'
          }

      # Box3DTargetApple is what adds the iOS target framework to the packable
      # projects. It is off by default so that building this repository needs
      # neither the .NET 10 SDK nor a workload that does not exist for Linux;
      # this is the job that asks for it, and the only one that has to.
      - name: Pack
        run: >
          dotnet pack
          --configuration Release
          --output ./artifacts/packages
          -p:Box3DTargetApple=true

      # Inspect the package rather than trusting that pack did the right thing.
      # A PackagePath that resolves to a directory rather than a file, for
      # instance, silently produces runtimes\win-x64\native\win-x64\native\ -
      # a package that restores cleanly and then fails to load on every
      # platform. That has happened here before.
      - name: Inspect the packages
        shell: pwsh
        run: |
          $required = @(
              'runtimes/win-x64/native/box3d.dll'
              'runtimes/win-arm64/native/box3d.dll'
              'runtimes/linux-x64/native/libbox3d.so'
              'runtimes/linux-arm64/native/libbox3d.so'
              'runtimes/osx-x64/native/libbox3d.dylib'
              'runtimes/osx-arm64/native/libbox3d.dylib'
              'runtimes/android-arm64/native/libbox3d.so'
              'runtimes/android-x64/native/libbox3d.so'
          )

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $failed = $false

          foreach ($package in Get-ChildItem ./artifacts/packages -Filter *.nupkg) {
              Write-Host "== $($package.Name) ($([math]::Round($package.Length / 1KB, 1)) KB)"
              $zip = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
              try {
                  $entries = $zip.Entries.FullName
                  $entries | Sort-Object | ForEach-Object { Write-Host "   $_" }

                  # Nothing that should never ship.
                  foreach ($entry in $entries) {
                      if ($entry -match '\.(pdb|user|suo)$' -or $entry -match '(^|/)(obj|bin)/') {
                          Write-Host "::error::$($package.Name) contains a build leftover: $entry"
                          $failed = $true
                      }
                  }

                  if ($package.Name -like 'Box3D.NET.Native.*') {
                      foreach ($asset in $required) {
                          if ($entries -notcontains $asset) {
                              Write-Host "::error::$($package.Name) is missing $asset"
                              $failed = $true
                          }
                      }

                      # A doubled runtimes path restores without complaint and
                      # then resolves on no platform at all.
                      foreach ($entry in $entries) {
                          if ($entry -match 'runtimes/.*/runtimes/') {
                              Write-Host "::error::$($package.Name) has a doubled runtimes path: $entry"
                              $failed = $true
                          }
                      }

                      # iOS travels as build files rather than runtime assets,
                      # so none of the checks above would notice it missing -
                      # and a package that restores on iOS and then cannot link
                      # is exactly the failure this whole job exists to catch.
                      if (-not ($entries | Where-Object { $_ -like 'buildTransitive/*/Box3D.NET.Native.targets' })) {
                          Write-Host "::error::$($package.Name) carries no iOS build file"
                          $failed = $true
                      }

                      foreach ($variant in 'ios-arm64', 'simulator') {
                          if (-not ($entries | Where-Object { $_ -like "buildTransitive/*/box3d.xcframework/*$variant*/libbox3d.a" })) {
                              Write-Host "::error::$($package.Name) is missing the $variant archive of box3d.xcframework"
                              $failed = $true
                          }
                      }

                      # The static archives belong to the framework and nowhere
                      # else. One under runtimes/ is dead weight: nothing loads
                      # an archive at run time, so it would add megabytes while
                      # serving no platform at all.
                      foreach ($entry in $entries) {
                          if ($entry -like 'runtimes/*.a' -or $entry -like 'runtimes/*/*.a') {
                              Write-Host "::error::$($package.Name) has a static archive under runtimes/: $entry"
                              $failed = $true
                          }
                      }
                  }

                  foreach ($expected in 'README.md', 'LICENSE', 'THIRD-PARTY-NOTICES.txt', 'icon.png') {
                      if ($entries -notcontains $expected) {
                          Write-Host "::error::$($package.Name) is missing $expected"
                          $failed = $true
                      }
                  }
              }
              finally {
                  $zip.Dispose()
              }
          }

          # Symbols travel separately and must exist for both packages.
          foreach ($id in 'Box3D.NET', 'Box3D.NET.Native') {
              if (-not (Get-ChildItem ./artifacts/packages -Filter "$id.*.snupkg")) {
                  Write-Host "::error::no symbol package was produced for $id"
                  $failed = $true
              }
          }

          if ($failed) { throw 'Package inspection found problems.' }
          Write-Host 'Package contents verified.'

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ./artifacts/packages/
          retention-days: 14

  # Installs the packed .nupkg into a project that has never heard of this
  # repository, and runs a real simulation through it.
  #
  # This is the check the repository did not have. Building the solution proves
  # nothing about the package: a project reference resolves assemblies from bin/
  # and copies the native library through a target in Directory.Build.targets,
  # so it never exercises runtimes/<rid>/native, the NuGet asset resolution, or
  # the loader. Everything that can only break at a consumer's machine was
  # therefore untested until now.
  #
  # Every declared RID is covered, because a platform in the support matrix
  # without evidence is a claim rather than a fact.
  consumer:
    name: package consumer (${{ matrix.rid }})
    needs: pack
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   rid: win-x64,     aot: true,  mode: Framework }
          - { os: windows-11-arm,   rid: win-arm64,   aot: false, mode: Framework }
          - { os: ubuntu-latest,    rid: linux-x64,   aot: true,  mode: Framework }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, aot: false, mode: Framework }
          # osx-x64 runs on the arm64 image, under Rosetta 2, and not by
          # preference. The Intel macos-13 image is on its way out and a job
          # asking for one sat queued for over an hour without ever being
          # picked up, which is worse than a failure: timeout-minutes counts
          # execution rather than queuing, so nothing ever reports.
          #
          # Rosetta is a real execution of the x64 binary against the x64
          # native library, so the asset resolution and the loader are
          # genuinely exercised. What it does not prove is behaviour on Intel
          # silicon, and the platform table says so rather than implying
          # otherwise.
          #
          # It has to be self-contained. A framework-dependent x64 binary
          # starts under Rosetta and then dies on libhostfxr.dylib, because
          # the only .NET on an arm64 runner is arm64:
          #
          #   mach-o file, but is an incompatible architecture
          #   (have 'arm64', need 'x86_64')
          #
          # That is the runner missing an x64 runtime, not the package being
          # wrong, so the consumer carries its own runtime instead of the job
          # installing a second .NET to work around it.
          - { os: macos-14,         rid: osx-x64,     aot: false, mode: SelfContained }
          - { os: macos-14,         rid: osx-arm64,   aot: true,  mode: Framework }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Install the native toolchain
        if: matrix.aot && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: ./artifacts/packages

      # Everywhere: restore, native library load, world, bodies, Step, raycast,
      # events, dispose. Framework-dependent, except where the runner has no
      # runtime of that architecture; see the matrix.
      - name: Consume the package
        shell: pwsh
        run: ./tools/verify-package.ps1 -Rid ${{ matrix.rid }} -Mode ${{ matrix.mode }}

      # Trimming and NativeAOT where a cross-compiling toolchain is available on
      # the runner. The arm64 Linux and Windows runners and the Intel Mac are
      # deliberately left at the framework-dependent check rather than given a
      # cross-compilation setup whose failures would say more about the runner
      # than about this package.
      - name: Consume the package, trimmed
        if: matrix.aot
        shell: pwsh
        run: ./tools/verify-package.ps1 -Rid ${{ matrix.rid }} -Mode Trimmed

      - name: Consume the package with NativeAOT
        if: matrix.aot
        shell: pwsh
        run: ./tools/verify-package.ps1 -Rid ${{ matrix.rid }} -Mode Aot

  # The same idea as the job above, for the two platforms that have no
  # executable a runner can start.
  #
  # Neither of these runs physics; they build a real application against the
  # packed .nupkg and then open what it produced. That covers the part that is
  # specific to mobile and invisible everywhere else: whether the native library
  # is inside the apk, and whether the static archive survived the iOS link.
  # What it does not cover is execution on a device, and the platform table says
  # so rather than implying otherwise.
  consumer-mobile:
    name: package consumer (${{ matrix.platform }})
    needs: pack
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: Android, workload: android }
          - { os: macos-14,      platform: iOS,     workload: ios }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The Android SDK tooling pins the JDK it accepts and rejects anything
      # newer outright (XA0030), so the runner's default cannot be relied on.
      - uses: actions/setup-java@v4
        if: matrix.platform == 'Android'
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the ${{ matrix.workload }} workload
        run: dotnet workload install ${{ matrix.workload }} --skip-sign-check

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: ./artifacts/packages

      - name: Consume the package
        shell: pwsh
        run: ./tools/verify-package-mobile.ps1 -Platform ${{ matrix.platform }}
